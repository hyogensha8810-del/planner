<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="theme-color" content="#24425f">
<title>Handwriting Planner 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kurenaido&family=Yomogi&family=Zen+Maru+Gothic:wght@400;700&family=Yuji+Syuku&family=Caveat:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bar:#24425f; --bar2:#2d5479; --bar-a:#e9f2fb;
  --ink:#1c2733; --muted:#7b8794; --line:#d8dde3;
  --sun:#e8a9b8; --sun-ink:#c8384f;
  --sat:#a8c4e8; --sat-ink:#2f62a8;
  --paper:#ffffff; --desk:#e7e9ec;
  --accent:#3d7ebd;
  --pageW:1600px; --pageH:1180px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--desk); color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  overflow:hidden; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none;
  padding-top:env(safe-area-inset-top);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- toolbar ---------- */
#chrome{position:relative;z-index:60}
.bar{
  background:linear-gradient(#2d5479,#24425f); color:#fff;
  display:flex;align-items:center;gap:6px;padding:7px 10px;flex-wrap:wrap;
  box-shadow:0 1px 0 rgba(0,0,0,.15)
}
.bar .sp{flex:1}
.tbtn{
  width:38px;height:34px;border-radius:9px;display:grid;place-items:center;
  transition:background .12s,transform .08s
}
.tbtn:hover{background:rgba(255,255,255,.14)}
.tbtn:active{transform:scale(.94)}
.tbtn.on{background:#fff;color:var(--bar)}
.tbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.divider{width:1px;height:22px;background:rgba(255,255,255,.28);margin:0 4px}
.pill{
  padding:5px 11px;border-radius:999px;font-size:12px;letter-spacing:.04em;
  background:rgba(255,255,255,.12)
}
.pill.on{background:#fff;color:var(--bar);font-weight:600}
.savechip{font-size:11px;opacity:.8;padding:0 6px;min-width:74px;text-align:right}

/* option row */
.opts{
  background:#f4f6f8;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:7px 12px;flex-wrap:wrap;
  font-size:12px;color:#41505f;min-height:44px
}
.opts .grp{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.opts label{font-size:11px;color:var(--muted);letter-spacing:.03em}
#penColors,#mkColors,#txColors{display:inline-flex;gap:7px;align-items:center}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;flex:0 0 auto}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.wbtn{width:34px;height:24px;border-radius:7px;display:grid;place-items:center}
.wbtn.on{background:#e3edf7}
.wbtn i{display:block;background:#31404f;border-radius:3px;width:22px}
.mini{padding:4px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px}
.mini:hover{background:#eef3f8}
select.mini,input.mini{padding:4px 6px}
input[type=range]{width:110px;accent-color:var(--accent)}
.switch{display:flex;align-items:center;gap:6px;font-size:11px;color:#41505f}

/* ---------- stage ---------- */
#scroller{position:absolute;inset:0;top:var(--chromeH,96px);overflow:auto;-webkit-overflow-scrolling:touch;display:block}
#stage{position:relative;margin:0 auto;padding:22px}
#page{
  position:relative;width:var(--pageW);height:var(--pageH);background:var(--paper);
  transform-origin:0 0;box-shadow:0 10px 34px rgba(20,30,45,.16);
}
#bg{position:absolute;inset:0;z-index:1}
#cv{position:absolute;inset:0;z-index:5;touch-action:none;width:100%;height:100%}
#ov{position:absolute;inset:0;z-index:6;pointer-events:none;width:100%;height:100%}
#chromeLayer{position:absolute;inset:0;z-index:10;pointer-events:none}
#chromeLayer >*{pointer-events:auto}
#editLayer{position:absolute;inset:0;z-index:20;pointer-events:none}

/* page furniture */
.h-num{position:absolute;font-weight:300;font-size:112px;line-height:.85;letter-spacing:-.03em;color:#2b3644}
.h-year{position:absolute;font-size:26px;font-weight:600;letter-spacing:.02em}
.h-mon{position:absolute;font-size:16px;letter-spacing:.34em;color:var(--muted)}
.h-jp{position:absolute;font-size:13px;letter-spacing:.2em;color:#9aa4ae}

.seg{position:absolute;display:flex;gap:6px}
.seg button{
  padding:6px 14px;border:1px solid var(--line);border-radius:6px;background:#fff;
  font-size:11px;letter-spacing:.12em;color:#5a6773
}
.seg button.on{background:#31404f;border-color:#31404f;color:#fff}
.wseg{position:absolute;display:flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:3px}
.wseg button{padding:4px 9px;border-radius:4px;font-size:11px;color:#5a6773;letter-spacing:.06em}
.wseg button.on{background:#31404f;color:#fff}

.ymNav{position:absolute;display:flex;align-items:center;justify-content:space-between;
  border:1px solid #31404f;border-radius:3px;height:26px;padding:0 6px;font-size:12px;letter-spacing:.08em;color:#31404f}
.ymNav button{padding:0 6px;font-size:10px}
.yearSw{position:absolute;display:flex;gap:5px}
.yearSw button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:4px 10px;font-size:11px;color:#5a6773}
.yearSw button.on{background:#31404f;border-color:#31404f;color:#fff}

.sideBox{position:absolute;border:1px solid #c9cfd6;border-radius:2px}
.sideLbl{position:absolute;font-size:10px;letter-spacing:.34em;color:#8d97a1}
.rule{position:absolute;left:0;right:0;height:1px;background:#eef1f4}

.mtab{position:absolute;left:0;right:0;display:grid;place-items:center;font-size:10px;
  letter-spacing:.14em;color:#98a2ac;border-radius:3px}
.mtab.on{background:#31404f;color:#fff;font-weight:600}

.wkhead{position:absolute;font-size:10px;letter-spacing:.2em;color:#8d97a1;text-align:center}
.cell{position:absolute;background:#fff;border:1px solid var(--line);border-radius:2px}
.cell.sat{border-color:var(--sat);}
.cell.sun{border-color:var(--sun);}
.cell.out{background:#fff;border-color:#e9edf1}
.cell.todayCell{box-shadow:inset 0 0 0 2px #f0c86a}
.cell .dn{position:absolute;top:5px;left:8px;font-size:13px;font-weight:600;color:#5d6874;letter-spacing:.02em}
.cell.sat .dn{color:var(--sat-ink)}
.cell.sun .dn{color:var(--sun-ink)}
.cell.out .dn{color:#c9ced4}
.cell .hol{position:absolute;top:7px;left:30px;right:6px;font-size:10px;color:#dda2ae;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .wk{position:absolute;right:-1px;top:-1px;bottom:-1px;width:0}
.wkbadge{position:absolute;display:grid;place-items:center;font-size:9px;letter-spacing:.06em;
  color:#fff;background:#98a2ac;border-radius:2px;writing-mode:vertical-rl}

/* editor overlay */
.tedit{
  position:absolute;pointer-events:auto;border:1.5px dashed var(--accent);border-radius:4px;
  background:rgba(255,255,255,.94);outline:none;resize:none;overflow:hidden;padding:2px 3px;
  color:inherit;line-height:1.45;letter-spacing:.01em
}
.selbar{
  position:absolute;pointer-events:auto;display:flex;gap:2px;background:#31404f;border-radius:9px;
  padding:4px;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:30
}
.selbar button{color:#fff;padding:5px 9px;border-radius:6px;font-size:11px;white-space:nowrap}
.selbar button:hover{background:rgba(255,255,255,.16)}

/* modal */
.mask{position:fixed;inset:0;background:rgba(18,26,36,.5);z-index:200;display:grid;place-items:center;padding:20px}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.3);
  max-height:86vh;overflow:auto}
.modal h2{margin:0 0 4px;font-size:17px}
.modal p{font-size:12.5px;line-height:1.7;color:#5a6773;margin:6px 0}
.modal input[type=text]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;margin-top:6px}
.modal ol{font-size:12.5px;line-height:1.85;color:#5a6773;padding-left:18px;margin:8px 0}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px}
.btn.pri{background:var(--bar);border-color:var(--bar);color:#fff}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#24425f;color:#fff;
  padding:10px 18px;border-radius:999px;font-size:13px;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:820px){ .savechip{display:none} }
</style>
</head>
<body>
<div id="chrome">
  <div class="bar">
    <button class="tbtn" id="tSelect" title="なげなわ / 選択">
      <svg viewBox="0 0 24 24"><path d="M12 4c4.4 0 8 2.5 8 5.6 0 3-3.6 5.5-8 5.5-1 0-2-.1-2.9-.4"/><path d="M9.1 14.7C6.6 13.7 5 11.8 5 9.6 5 6.5 8.6 4 12 4"/><path d="M9.1 14.7c-.8 1.6-.3 3.4 1 4.3"/><circle cx="10.6" cy="19.7" r="1.4"/></svg>
    </button>
    <button class="tbtn on" id="tPen" title="ペン">
      <svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19l-4 1z"/><path d="M14.5 6.5l3 3"/></svg>
    </button>
    <button class="tbtn" id="tMarker" title="マーカー">
      <svg viewBox="0 0 24 24"><path d="M9 14l-3.5.9L6.4 11 15 2.6a2 2 0 012.9 0l1.6 1.6a2 2 0 010 2.9L9 14z"/><path d="M4 21h16"/></svg>
    </button>
    <button class="tbtn" id="tEraser" title="消しゴム">
      <svg viewBox="0 0 24 24"><path d="M8.5 19.5L3.9 15a2 2 0 010-2.8l8.3-8.3a2 2 0 012.8 0l4.6 4.6a2 2 0 010 2.8l-8.7 8.2z"/><path d="M8 20h11"/><path d="M9.4 8.6l6 6"/></svg>
    </button>
    <button class="tbtn" id="tText" title="テキスト入力">
      <svg viewBox="0 0 24 24"><path d="M5 6.5V5h14v1.5"/><path d="M12 5v14"/><path d="M9 19h6"/></svg>
    </button>
    <button class="tbtn" id="tImage" title="画像を配置">
      <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4 17l5-4.5 3.5 3L16 12l4 4"/></svg>
    </button>
    <div class="divider"></div>
    <button class="tbtn" id="bUndo" title="元に戻す"><svg viewBox="0 0 24 24"><path d="M9 8H5V4"/><path d="M5 8a8 8 0 113 9.5"/></svg></button>
    <button class="tbtn" id="bRedo" title="やり直す"><svg viewBox="0 0 24 24"><path d="M15 8h4V4"/><path d="M19 8a8 8 0 10-3 9.5"/></svg></button>
    <div class="sp"></div>
    <span class="savechip" id="saveChip">保存済み</span>
    <button class="tbtn" id="bZoomOut" title="縮小"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M8.5 11h5M16 16l4 4"/></svg></button>
    <button class="tbtn" id="bZoomIn" title="拡大"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M8.5 11h5M11 8.5v5M16 16l4 4"/></svg></button>
    <button class="tbtn" id="bFit" title="全体表示"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <div class="divider"></div>
    <button class="tbtn" id="bMenu" title="保存・同期・設定"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
  </div>

  <div class="opts" id="opts">
    <!-- pen / marker -->
    <div class="grp" data-for="pen marker">
      <label>太さ</label>
      <button class="wbtn on" data-w="0"><i style="height:2px"></i></button>
      <button class="wbtn" data-w="1"><i style="height:4px"></i></button>
      <button class="wbtn" data-w="2"><i style="height:7px"></i></button>
    </div>
    <div class="grp" data-for="pen"><label>色</label><span id="penColors"></span></div>
    <div class="grp" data-for="marker"><label>色</label><span id="mkColors"></span></div>
    <!-- eraser -->
    <div class="grp" data-for="eraser">
      <label>サイズ</label><input type="range" id="eraSize" min="6" max="80" value="22">
      <span id="eraNum" style="width:26px;text-align:right">22</span>
    </div>
    <div class="grp" data-for="eraser"><button class="mini" id="bClearPage">このページを全消去</button></div>
    <!-- select -->
    <div class="grp" data-for="select">
      <label>選択</label>
      <button class="mini on" id="lasFree">フリーハンド</button>
      <button class="mini" id="lasRect">長方形</button>

    <div class="grp" data-for="select"><span style="color:#8d97a1">囲んだ後：ドラッグで移動 / 角ハンドルで拡縮 / 上のハンドルで回転</span></div>
    <!-- text -->
    <div class="grp" data-for="text">
      <label>書体</label>
      <select class="mini" id="fontSel">
        <option value="'Klee One'">Klee One（万年筆風）</option>
        <option value="'Zen Kurenaido'">Zen 紅道（鉛筆風）</option>
        <option value="Yomogi">Yomogi（やわらか手書き）</option>
        <option value="'Yuji Syuku'">Yuji 楷書（筆風）</option>
        <option value="'Zen Maru Gothic'">丸ゴシック</option>
        <option value="Caveat">Caveat（英字筆記体）</option>
      </select>
    </div>
    <div class="grp" data-for="text">
      <label>文字サイズ</label>
      <button class="mini" id="fsMinus">−</button>
      <input type="range" id="fsRange" min="9" max="48" value="16">
      <span id="fsNum" style="width:34px;text-align:right">16px</span>
      <button class="mini" id="fsPlus">＋</button>
    </div>
    <div class="grp" data-for="text"><label>色</label><span id="txColors"></span></div>
    <div class="sp" style="flex:1"></div>
    <span class="switch" style="color:#8d97a1">2本指ピンチ＝拡大縮小 ／ 2本指ダブルタップ＝元に戻す</span>
    <label class="switch"><input type="checkbox" id="penOnly"> ペンのみ描画（指はスクロール）</label>
  </div>
</div>

<div id="scroller">
  <div id="stage">
    <div id="page">
      <div id="bg"></div>
      <canvas id="cv"></canvas>
      <canvas id="ov"></canvas>
      <div id="chromeLayer"></div>
      <div id="editLayer"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   Handwriting Planner — core
   ========================================================= */
const PAGE_W = 1600, PAGE_H = 1180;
const L = {
  side : {x:56,  w:252},
  grid : {x:336, y:196, w:1140, h:930, head:32},
  index: {x:1500,w:56,  y:196, h:930},
  boxes: {
    goals    :{lbl:228, y:242, h:110},
    schedules:{lbl:374, y:388, h:180},
    tasks    :{lbl:590, y:604, h:340},
    reminder :{lbl:966, y:980, h:146}
  }
};
const CW = L.grid.w/7;
const RH = (L.grid.h-L.grid.head)/6;

const MON_EN = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const MON_AB = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const WD_EN  = ['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY'];
const WD_JP  = ['月','火','水','木','金','土','日'];

/* ---------- 日本の祝日（今年＋来年の自動拡張に対応した汎用計算） ---------- */
const pad=n=>String(n).padStart(2,'0');
const key=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
function nthMonday(y,m,n){ // m:1-12
  const first=new Date(y,m-1,1).getDay();          // 0=Sun
  const off=(8-first)%7;                            // first Monday date-1
  return 1+off+(n-1)*7;
}
function vernal(y){ return Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4)); }
function autumnal(y){ return Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4)); }
const holidayCache={};
function holidays(y){
  if(holidayCache[y]) return holidayCache[y];
  const h={};
  const set=(m,d,name)=>{ h[key(y,m,d)]=name; };
  set(1,1,'元日');
  set(1,nthMonday(y,1,2),'成人の日');
  set(2,11,'建国記念の日');
  set(2,23,'天皇誕生日');
  set(3,vernal(y),'春分の日');
  set(4,29,'昭和の日');
  set(5,3,'憲法記念日');
  set(5,4,'みどりの日');
  set(5,5,'こどもの日');
  set(7,nthMonday(y,7,3),'海の日');
  set(8,11,'山の日');
  set(9,nthMonday(y,9,3),'敬老の日');
  set(9,autumnal(y),'秋分の日');
  set(10,nthMonday(y,10,2),'スポーツの日');
  set(11,3,'文化の日');
  set(11,23,'勤労感謝の日');
  // 振替休日
  const base=Object.keys(h).sort();
  base.forEach(k=>{
    const d=new Date(k+'T00:00:00');
    if(d.getDay()===0){
      let n=new Date(d);
      do{ n.setDate(n.getDate()+1); }while(h[key(n.getFullYear(),n.getMonth()+1,n.getDate())]);
      h[key(n.getFullYear(),n.getMonth()+1,n.getDate())]='振替休日';
    }
  });
  // 国民の休日（祝日に挟まれた平日）
  for(let m=1;m<=12;m++){
    const dim=new Date(y,m,0).getDate();
    for(let d=2;d<dim;d++){
      const k=key(y,m,d);
      if(h[k]) continue;
      const dt=new Date(y,m-1,d);
      if(dt.getDay()===0||dt.getDay()===6) continue;
      const p=new Date(y,m-1,d-1), n=new Date(y,m-1,d+1);
      if(h[key(p.getFullYear(),p.getMonth()+1,p.getDate())]&&h[key(n.getFullYear(),n.getMonth()+1,n.getDate())])
        h[k]='国民の休日';
    }
  }
  holidayCache[y]=h; return h;
}
const holidayOf=(y,m,d)=>holidays(y)[key(y,m,d)]||null;

/* ---------- 保存（IndexedDB / localStorage フォールバック） ---------- */
const Store=(()=>{
  let db=null, ready=false;
  const memo={};
  function open(){
    return new Promise(res=>{
      if(!('indexedDB' in window)) return res(null);
      let rq;
      try{ rq=indexedDB.open('planner-db',1); }catch(e){ return res(null); }
      rq.onupgradeneeded=()=>{ rq.result.createObjectStore('pages',{keyPath:'id'}); };
      rq.onsuccess=()=>res(rq.result);
      rq.onerror=()=>res(null);
    });
  }
  async function init(){ db=await open(); ready=true; }
  function lsGet(id){ try{ const v=localStorage.getItem('pg:'+id); return v?JSON.parse(v):null; }catch(e){ return null; } }
  function lsSet(id,data){ try{ localStorage.setItem('pg:'+id,JSON.stringify(data)); }catch(e){} }
  async function get(id){
    if(!ready) await init();
    if(!db) return lsGet(id);
    return new Promise(res=>{
      const t=db.transaction('pages','readonly').objectStore('pages').get(id);
      t.onsuccess=()=>res(t.result?t.result.data:null);
      t.onerror=()=>res(lsGet(id));
    });
  }
  async function put(id,data){
    memo[id]=data;
    if(!ready) await init();
    if(!db){ lsSet(id,data); return; }
    return new Promise(res=>{
      const t=db.transaction('pages','readwrite').objectStore('pages').put({id,data});
      t.onsuccess=()=>res(); t.onerror=()=>{ lsSet(id,data); res(); };
    });
  }
  async function all(){
    if(!ready) await init();
    if(!db){
      const o={};
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k.startsWith('pg:')) o[k.slice(3)]=JSON.parse(localStorage.getItem(k));
      }
      return o;
    }
    return new Promise(res=>{
      const t=db.transaction('pages','readonly').objectStore('pages').getAll();
      t.onsuccess=()=>{ const o={}; (t.result||[]).forEach(r=>o[r.id]=r.data); res(o); };
      t.onerror=()=>res({});
    });
  }
  async function putAll(obj){ for(const id in obj) await put(id,obj[id]); }
  return {get,put,all,putAll,init};
})();

function monthMatrix(y,m){
  const first=new Date(y,m-1,1);
  const shift=(first.getDay()+6)%7;              // 月曜始まり
  const start=new Date(y,m-1,1-shift);
  const out=[];
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    out.push(d);
  }
  return out;
}

function monthRows(y,m){
  const shift=(new Date(y,m-1,1).getDay()+6)%7;

  for(let r=0;r<rows;r++){
    bg.appendChild(el('wkbadge',{left:px(g.x+g.w+4),top:px(g.y+g.head+r*rh+10),width:px(14),height:px(rh-20)},'WEEK'+(r+1)));

<script>
/* =========================================================
   描画エンジン / 選択 / テキスト / 画像
   ========================================================= */
let dprEff=1;
const IMGC={};                                     // 画像キャッシュ
function imgFor(src){
  if(IMGC[src]) return IMGC[src];
  const im=new Image(); im.onload=()=>render(); im.src=src; IMGC[src]=im; return im;
}
function fitCanvas(){
  dprEff=Math.min((window.devicePixelRatio||1)*S.zoom,3);
  [cv,ov].forEach(c=>{
    c.width=Math.round(PAGE_W*dprEff); c.height=Math.round(PAGE_H*dprEff);
    c.style.width=PAGE_W+'px'; c.style.height=PAGE_H+'px';
    c.getContext('2d').setTransform(dprEff,0,0,dprEff,0,0);
  });
  render(); renderOverlay();
}

/* ---------- テキスト計測 ---------- */
function setFont(c,it){ c.font=`${it.size}px ${it.font}, "Hiragino Kaku Gothic ProN", sans-serif`; }
function wrapLines(c,it){
  setFont(c,it);
  const out=[];
  String(it.text||'').split('\n').forEach(par=>{
    if(par===''){ out.push(''); return; }
    let line='';
    for(const ch of par){
      const t=line+ch;
      if(c.measureText(t).width>it.w && line!==''){ out.push(line); line=ch; }
      else line=t;
    }
    out.push(line);
  });
  return out;
}
function textRect(it){
  const lines=wrapLines(ctx,it);
  const lh=it.size*1.45;
  return {x:it.x,y:it.y,w:it.w,h:Math.max(lh,lines.length*lh)+4,lines,lh};
}
function itemRect(it){
  if(it.t==='text') return textRect(it);
  if(it.t==='img')  return {x:it.x,y:it.y,w:it.w,h:it.h};
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  it.p.forEach(p=>{ x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]); });
  const pad=(it.w0||2)/2+1;
  return {x:x0-pad,y:y0-pad,w:x1-x0+pad*2,h:y1-y0+pad*2};
}
function itemCorners(it){
  const r=itemRect(it);
  const pts=[[r.x,r.y],[r.x+r.w,r.y],[r.x+r.w,r.y+r.h],[r.x,r.y+r.h]];
  const rot=it.rot||0;
  if(!rot) return pts;
  const cx=r.x+r.w/2, cy=r.y+r.h/2, cs=Math.cos(rot), sn=Math.sin(rot);
  return pts.map(([x,y])=>[cx+(x-cx)*cs-(y-cy)*sn, cy+(x-cx)*sn+(y-cy)*cs]);
}
function boxOf(list){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  list.forEach(it=>itemCorners(it).forEach(([x,y])=>{
    x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}));
  if(x0>x1) return null;
  return {x:x0,y:y0,w:x1-x0,h:y1-y0};
}

/* ---------- 本体描画 ---------- */
let editingId=null;
function drawItem(c,it){
  if(it.id===editingId) return;
  if(it.t==='stroke'){
    const marker=it.mode==='marker';
    c.save();
    if(marker){ c.globalCompositeOperation='multiply'; c.globalAlpha=.55; }
    c.strokeStyle=it.c; c.lineCap='round'; c.lineJoin='round';
    const p=it.p;
    if(p.length===1){
      c.beginPath(); c.arc(p[0][0],p[0][1],it.w0/2,0,7); c.fillStyle=it.c; c.fill(); c.restore(); return;
    }
    if(marker){
      c.lineWidth=it.w0; c.beginPath(); c.moveTo(p[0][0],p[0][1]);
      for(let i=1;i<p.length;i++) c.lineTo(p[i][0],p[i][1]);
      c.stroke();
    }else{
      for(let i=1;i<p.length;i++){
        const a=p[i-1],b=p[i];
        const pr=((a[2]??.5)+(b[2]??.5))/2;
        c.lineWidth=it.w0*(0.58+0.62*pr);
        c.beginPath(); c.moveTo(a[0],a[1]);
        const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
        c.quadraticCurveTo(a[0],a[1],mx,my); c.lineTo(b[0],b[1]); c.stroke();
      }
    }
    c.restore(); return;
  }
  if(it.t==='text'){
    const r=textRect(it);
    c.save();
    if(it.rot){ const cx=r.x+r.w/2,cy=r.y+r.h/2; c.translate(cx,cy); c.rotate(it.rot); c.translate(-cx,-cy); }
    setFont(c,it); c.fillStyle=it.c; c.textBaseline='top';
    r.lines.forEach((ln,i)=>c.fillText(ln,it.x,it.y+i*r.lh+2));
    c.restore(); return;
  }
  if(it.t==='img'){
    const im=imgFor(it.src);
    c.save();
    if(it.rot){ const cx=it.x+it.w/2,cy=it.y+it.h/2; c.translate(cx,cy); c.rotate(it.rot); c.translate(-cx,-cy); }
    if(im.complete&&im.naturalWidth) c.drawImage(im,it.x,it.y,it.w,it.h);
    else { c.fillStyle='#eef1f4'; c.fillRect(it.x,it.y,it.w,it.h); }
    c.restore();
  }
}
function render(){
  ctx.clearRect(0,0,PAGE_W,PAGE_H);
  S.items.filter(i=>i.t==='stroke'&&i.mode==='marker').forEach(i=>drawItem(ctx,i));
  S.items.filter(i=>!(i.t==='stroke'&&i.mode==='marker')).forEach(i=>drawItem(ctx,i));
}

/* ---------- オーバーレイ（選択・なげなわ） ---------- */
let lassoPts=null, lassoRect=null;
function renderOverlay(){
  octx.clearRect(0,0,PAGE_W,PAGE_H);
  octx.save();
  if(lassoPts&&lassoPts.length>1){
    octx.strokeStyle='#3d7ebd'; octx.lineWidth=1.4; octx.setLineDash([6,4]);
    octx.beginPath(); octx.moveTo(lassoPts[0][0],lassoPts[0][1]);
    lassoPts.forEach(p=>octx.lineTo(p[0],p[1])); octx.stroke();
    octx.fillStyle='rgba(61,126,189,.08)'; octx.fill();
  }
  if(lassoRect){
    octx.strokeStyle='#3d7ebd'; octx.lineWidth=1.4; octx.setLineDash([6,4]);
    octx.strokeRect(lassoRect.x,lassoRect.y,lassoRect.w,lassoRect.h);
    octx.fillStyle='rgba(61,126,189,.08)';
    octx.fillRect(lassoRect.x,lassoRect.y,lassoRect.w,lassoRect.h);
  }
  const b=S.selBox;
  if(b){
    octx.setLineDash([5,4]); octx.strokeStyle='#3d7ebd'; octx.lineWidth=1.4;
    octx.strokeRect(b.x-6,b.y-6,b.w+12,b.h+12);
    octx.setLineDash([]);
    // 拡縮ハンドル
    octx.fillStyle='#fff'; octx.strokeStyle='#3d7ebd'; octx.lineWidth=1.6;
    const hs=8;
    octx.beginPath(); octx.rect(b.x+b.w+6-hs/2,b.y+b.h+6-hs/2,hs,hs); octx.fill(); octx.stroke();
    // 回転ハンドル
    octx.beginPath(); octx.moveTo(b.x+b.w/2,b.y-6); octx.lineTo(b.x+b.w/2,b.y-26); octx.stroke();
    octx.beginPath(); octx.arc(b.x+b.w/2,b.y-30,6,0,7); octx.fill(); octx.stroke();
  }
  octx.restore();
  positionSelBar();
}

/* ---------- 履歴 ---------- */
function snapshot(){ return JSON.stringify(S.items); }
function pushUndo(){ S.undo.push(snapshot()); if(S.undo.length>30) S.undo.shift(); S.redo.length=0; }
function undo(){ if(!S.undo.length) return; S.redo.push(snapshot()); S.items=JSON.parse(S.undo.pop()); clearSel(); render(); scheduleSave(); }
function redo(){ if(!S.redo.length) return; S.undo.push(snapshot()); S.items=JSON.parse(S.redo.pop()); clearSel(); render(); scheduleSave(); }

/* ---------- 保存 ---------- */
let saveTimer=null, curId=null;
function chip(t){ $('saveChip').textContent=t; }
function scheduleSave(){
  if(!curId) return;
  chip('保存中…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    await Store.put(curId,{v:1,items:S.items,at:Date.now()});
    chip('保存済み');
  },300);
}
async function flushSave(){
  clearTimeout(saveTimer);
  if(!curId) return;
  await Store.put(curId,{v:1,items:S.items,at:Date.now()});
  chip('保存済み');
}

async function loadPage(){
  closeEditor();
  await flushSave().catch(()=>{});
  clearSel();
  const id=pageId();
  const rec=await Store.get(id);
  S.items=(rec&&rec.items)?rec.items:[];
  curId=id;
  S.undo.length=0; S.redo.length=0;
  buildBackground(); render(); renderOverlay();
}
function setView(v){ S.view=v; loadPage(); }
function shiftDay(dir){
  const d=new Date(S.y,S.m-1,S.d+dir);
  if(d.getFullYear()<BASE_YEAR||d.getFullYear()>BASE_YEAR+1) return;
  S.y=d.getFullYear(); S.m=d.getMonth()+1; S.d=d.getDate(); loadPage();
}
function shiftMonth(dir){
  let m=S.m+dir, y=S.y;
  if(m<1){ m=12; y--; } if(m>12){ m=1; y++; }
  if(y<BASE_YEAR||y>BASE_YEAR+1) return;
  S.y=y; S.m=m; S.wk=0; loadPage();
}

/* ---------- 座標 ---------- */
function toPage(ev){
  const r=cv.getBoundingClientRect();
  return [ (ev.clientX-r.left)/S.zoom, (ev.clientY-r.top)/S.zoom ];
}
function boxAt(x,y){
  let best=null;
  TEXT_BOXES.forEach(b=>{ if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h) best=b; });
  return best;
}

/* ---------- ポインタ ----------
   キャンバスは常に touch-action:none。ブラウザ任せのスクロールをやめ、
   1本指パン / 2本指ピンチ / 2本指ダブルタップ（元に戻す）を自前で処理する。
   これをしないと iOS Safari が Apple Pencil のドラッグまでスクロールとして扱う。   */
let mode=null, cursor=null, start=null, lastAng=0, lastDist=0, movedFlag=false;
const touches=new Map();
let pinch=null, pan=null, lastTwoTap=0;
let gest={max:0,t0:0,moved:false,sx:0,sy:0};
const dist2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

cv.addEventListener('pointerdown',onDown);
cv.addEventListener('pointermove',onMove);
window.addEventListener('pointerup',onUp);
window.addEventListener('pointercancel',onUp);

/* 描きかけを取り消す（2本目の指が触れたとき用） */
function cancelStroke(){
  if(mode==='draw'&&cursor){
    S.items=S.items.filter(i=>i!==cursor);
    if(S.undo.length) S.undo.pop();
    cursor=null; render();
  }
  if(mode==='lasso'||mode==='lassoRect'){ lassoPts=null; lassoRect=null; renderOverlay(); }
  if(mode!=='pinch') mode=null;
}
function onDown(ev){
  if(ev.button===2) return;
  if(ev.pointerType==='touch'){
    touches.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
    if(touches.size===1) gest={max:1,t0:performance.now(),moved:false,sx:ev.clientX,sy:ev.clientY};
    else gest.max=Math.max(gest.max,touches.size);
    if(touches.size>=2){
      cancelStroke(); pan=null;
      const t=[...touches.values()];
      pinch={d:dist2(t[0],t[1])||1, z:S.zoom};
      mode='pinch';
      return;
    }
    if(S.penOnly){ pan={x:ev.clientX,y:ev.clientY}; mode='pan'; return; }
  }
  const [x,y]=toPage(ev);
  try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
  movedFlag=false;
  if(S.tool==='pen'||S.tool==='marker'){
    pushUndo();
    const marker=S.tool==='marker';
    const it={id:uid(),t:'stroke',mode:marker?'marker':'pen',
      c:marker?S.marker.color:S.pen.color,
      w0:marker?MK_W[S.marker.w]:PEN_W[S.pen.w],
      p:[[x,y,ev.pressure||.5]]};
    S.items.push(it); cursor=it; mode='draw'; render(); return;
  }
  if(S.tool==='eraser'){ pushUndo(); mode='erase'; eraseAt(x,y); return; }
  if(S.tool==='text'){ if(ta){ closeEditor(); return; } createText(x,y); return; }
  if(S.tool==='select'){
    const b=S.selBox;
    if(b){
      const hx=b.x+b.w+6, hy=b.y+b.h+6;
      if(Math.hypot(x-hx,y-hy)<14){ mode='scale'; start=[x,y];
        const c=[b.x+b.w/2,b.y+b.h/2]; lastDist=Math.hypot(x-c[0],y-c[1])||1; pushUndo(); return; }
      const rx=b.x+b.w/2, ry=b.y-30;
      if(Math.hypot(x-rx,y-ry)<14){ mode='rotate';
        const c=[b.x+b.w/2,b.y+b.h/2]; lastAng=Math.atan2(y-c[1],x-c[0]); pushUndo(); return; }
      if(x>=b.x-6&&x<=b.x+b.w+6&&y>=b.y-6&&y<=b.y+b.h+6){ mode='move'; start=[x,y]; pushUndo(); return; }
    }
    clearSel();
    if(S.lasso==='free'){ mode='lasso'; lassoPts=[[x,y]]; }
    else { mode='lassoRect'; start=[x,y]; lassoRect={x,y,w:0,h:0}; }
    renderOverlay(); return;
  }
}
function onMove(ev){
  if(ev.pointerType==='touch'&&touches.has(ev.pointerId)){
    touches.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    if(Math.hypot(ev.clientX-gest.sx,ev.clientY-gest.sy)>10) gest.moved=true;
    if(mode==='pinch'&&touches.size>=2){
      const t=[...touches.values()];
      const d=dist2(t[0],t[1])||1;
      zoomAt(pinch.z*(d/pinch.d),(t[0].x+t[1].x)/2,(t[0].y+t[1].y)/2);
      return;
    }
    if(mode==='pan'&&pan){
      scroller.scrollLeft-=ev.clientX-pan.x;
      scroller.scrollTop -=ev.clientY-pan.y;
      pan={x:ev.clientX,y:ev.clientY};
      return;
    }
  }
  if(!mode||mode==='pinch'||mode==='pan') return;
  const [x,y]=toPage(ev);
  movedFlag=true;
  if(mode==='draw'){
    const evs=ev.getCoalescedEvents?ev.getCoalescedEvents():[ev];
    evs.forEach(e=>{ const [px_,py_]=toPage(e); cursor.p.push([px_,py_,e.pressure||.5]); });
    render(); return;
  }
  if(mode==='erase'){ eraseAt(x,y); return; }
  if(mode==='lasso'){ lassoPts.push([x,y]); renderOverlay(); return; }
  if(mode==='lassoRect'){
    lassoRect={x:Math.min(start[0],x),y:Math.min(start[1],y),w:Math.abs(x-start[0]),h:Math.abs(y-start[1])};
    renderOverlay(); return;
  }
  if(mode==='move'){
    const dx=x-start[0], dy=y-start[1]; start=[x,y];
    S.sel.forEach(it=>translate(it,dx,dy));
    S.selBox=boxOf(S.sel); render(); renderOverlay(); scheduleSave(); return;
  }
  if(mode==='scale'){
    const b=S.selBox, c=[b.x+b.w/2,b.y+b.h/2];
    const d=Math.hypot(x-c[0],y-c[1])||1;
    let f=d/lastDist; f=Math.max(.4,Math.min(2.4,f)); lastDist=d;
    S.sel.forEach(it=>scaleItem(it,f,c[0],c[1]));
    S.selBox=boxOf(S.sel); render(); renderOverlay(); scheduleSave(); return;
  }
  if(mode==='rotate'){
    const b=S.selBox, c=[b.x+b.w/2,b.y+b.h/2];
    const a=Math.atan2(y-c[1],x-c[0]); const da=a-lastAng; lastAng=a;
    S.sel.forEach(it=>rotateItem(it,da,c[0],c[1]));
    S.selBox=boxOf(S.sel); render(); renderOverlay(); scheduleSave(); return;
  }
}
function onUp(ev){
  if(ev&&ev.pointerType==='touch'){
    touches.delete(ev.pointerId);
    if(mode==='pinch'&&touches.size<2){ mode=null; pinch=null; fitCanvas(); }
    if(touches.size===0){
      if(mode==='pan'){ mode=null; pan=null; }
      const now=performance.now();
      if(gest.max===2&&!gest.moved&&now-gest.t0<350){      // 2本指タップ
        if(now-lastTwoTap<520){ lastTwoTap=0; undo(); toast('元に戻しました'); }
        else lastTwoTap=now;
      }
      gest={max:0,t0:0,moved:false,sx:0,sy:0};
    }
    if(mode==='pinch'||mode==='pan') return;
  }
  if(mode==='draw'){ cursor=null; scheduleSave(); }
  if(mode==='erase'){ scheduleSave(); }
  if(mode==='lasso'||mode==='lassoRect'){
    const poly=mode==='lasso'?lassoPts:
      (lassoRect?[[lassoRect.x,lassoRect.y],[lassoRect.x+lassoRect.w,lassoRect.y],
                  [lassoRect.x+lassoRect.w,lassoRect.y+lassoRect.h],[lassoRect.x,lassoRect.y+lassoRect.h]]:null);
    if(poly&&poly.length>2) selectIn(poly);
    lassoPts=null; lassoRect=null; renderOverlay();
  }
  mode=null; cursor=null;
}
const uid=()=>Math.random().toString(36).slice(2,10);

/* ---------- 消しゴム ---------- */
function eraseAt(x,y){
  const r=S.eraser.size/2;
  const out=[];
  let changed=false;
  S.items.forEach(it=>{
    if(it.t==='stroke'){
      const rr=r+it.w0/2;
      let cur=[], segs=[], hit=false;
      it.p.forEach(p=>{
        if(Math.hypot(p[0]-x,p[1]-y)<=rr){ hit=true; if(cur.length>1) segs.push(cur); cur=[]; }
        else cur.push(p);
      });
      if(cur.length>1) segs.push(cur);
      if(!hit){ out.push(it); return; }
      changed=true;
      segs.forEach(s=>out.push({...it,id:uid(),p:s}));
    }else{
      const rc=itemRect(it);
      if(x>=rc.x&&x<=rc.x+rc.w&&y>=rc.y&&y<=rc.y+rc.h){ changed=true; return; }
      out.push(it);
    }
  });
  if(changed){ S.items=out; render(); }
}

/* ---------- 選択・変形 ---------- */
function pinPoly(px_,py_,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
    if(((yi>py_)!==(yj>py_))&&(px_<(xj-xi)*(py_-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function selectIn(poly){
  S.sel=S.items.filter(it=>{
    if(it.t==='stroke') return it.p.some(p=>pinPoly(p[0],p[1],poly));
    const r=itemRect(it);
    return pinPoly(r.x+r.w/2,r.y+r.h/2,poly);
  });
  S.selBox=boxOf(S.sel);
  if(!S.sel.length) S.selBox=null;
  renderOverlay();
}
function clearSel(){ S.sel=[]; S.selBox=null; lassoPts=null; lassoRect=null; if(octx) renderOverlay(); }
function translate(it,dx,dy){
  if(it.t==='stroke') it.p.forEach(p=>{p[0]+=dx;p[1]+=dy;});
  else { it.x+=dx; it.y+=dy; }
}
function scaleItem(it,f,cx,cy){
  if(it.t==='stroke'){ it.p.forEach(p=>{p[0]=cx+(p[0]-cx)*f;p[1]=cy+(p[1]-cy)*f;}); it.w0*=f; return; }
  const r=itemRect(it);
  const ccx=r.x+r.w/2, ccy=r.y+r.h/2;
  const nx=cx+(ccx-cx)*f, ny=cy+(ccy-cy)*f;
  if(it.t==='text'){ it.size=Math.max(6,it.size*f); it.w*=f;
    const nr=textRect(it); it.x=nx-it.w/2; it.y=ny-nr.h/2; }
  else { it.w*=f; it.h*=f; it.x=nx-it.w/2; it.y=ny-it.h/2; }
}
function rotateItem(it,a,cx,cy){
  const cs=Math.cos(a),sn=Math.sin(a);
  const rot=(x,y)=>[cx+(x-cx)*cs-(y-cy)*sn, cy+(x-cx)*sn+(y-cy)*cs];
  if(it.t==='stroke'){ it.p.forEach(p=>{ const [nx,ny]=rot(p[0],p[1]); p[0]=nx;p[1]=ny; }); return; }
  const r=itemRect(it);
  const [nx,ny]=rot(r.x+r.w/2,r.y+r.h/2);
  it.rot=(it.rot||0)+a;
  it.x=nx-r.w/2; it.y=ny-r.h/2;
}

/* ---------- 選択ツールバー ---------- */
let selBar=null;
function positionSelBar(){
  if(!S.selBox||!S.sel.length){ if(selBar){ selBar.remove(); selBar=null; } return; }
  if(!selBar){
    selBar=document.createElement('div'); selBar.className='selbar';
    const mk=(t,fn)=>{ const b=document.createElement('button'); b.textContent=t; b.onclick=fn; selBar.appendChild(b); };
    mk('複製',()=>{ pushUndo();
      const copies=S.sel.map(it=>{ const c=JSON.parse(JSON.stringify(it)); c.id=uid(); translate(c,18,18); return c; });
      S.items.push(...copies); S.sel=copies; S.selBox=boxOf(copies); render(); renderOverlay(); scheduleSave(); });
    mk('削除',()=>{ pushUndo(); S.items=S.items.filter(it=>!S.sel.includes(it)); clearSel(); render(); scheduleSave(); });
    mk('前面へ',()=>{ pushUndo(); const s=S.sel.slice(); S.items=S.items.filter(i=>!s.includes(i)).concat(s); render(); scheduleSave(); });
    mk('編集',()=>{ const t=S.sel.find(i=>i.t==='text'); if(t) openEditor(t); });
    mk('解除',()=>clearSel());
    editLayer.appendChild(selBar);
  }
  const b=S.selBox;
  selBar.style.left=Math.max(4,b.x)+'px';
  selBar.style.top=Math.max(4,b.y-46-(b.y<70?-b.h-70:0))+'px';
}

/* ---------- テキスト ---------- */
function createText(x,y){
  const box=boxAt(x,y);
  const w=box?box.w:240;
  const nx=box?Math.max(box.x,Math.min(x,box.x+box.w-w)):x;
  const it={id:uid(),t:'text',x:nx,y:y-S.text.size*0.2,w:w,
    text:'',font:S.text.font,size:S.text.size,c:S.text.color,rot:0};
  pushUndo(); S.items.push(it); openEditor(it);
}
let ta=null;
function openEditor(it){
  closeEditor();
  editingId=it.id; render();
  ta=document.createElement('textarea');
  ta.className='tedit'; ta.value=it.text||'';
  Object.assign(ta.style,{
    left:it.x-4+'px', top:it.y-2+'px', width:(it.w+8)+'px',
    fontFamily:it.font+', "Hiragino Kaku Gothic ProN", sans-serif',
    fontSize:it.size+'px', color:it.c, lineHeight:1.45,
    whiteSpace:'pre-wrap', wordBreak:'break-word'
  });
  editLayer.appendChild(ta);
  const grow=()=>{ ta.style.height='auto'; ta.style.height=(ta.scrollHeight+4)+'px'; };
  ta.addEventListener('input',grow);
  ta.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.key==='Escape'){ ta.blur(); }
  });
  ta.addEventListener('blur',()=>closeEditor());
  grow(); setTimeout(()=>{ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);},10);
}
function closeEditor(){
  if(!ta||ta._closing) return;
  ta._closing=true;
  const it=S.items.find(i=>i.id===editingId);
  const val=ta.value;
  if(ta.parentNode) ta.parentNode.removeChild(ta);
  ta=null; editingId=null;
  if(it){
    if(val.trim()==='') S.items=S.items.filter(i=>i!==it);
    else it.text=val;
  }
  render(); scheduleSave();
}
cv.addEventListener('dblclick',ev=>{
  const [x,y]=toPage(ev);
  const t=[...S.items].reverse().find(i=>{
    if(i.t!=='text') return false;
    const r=itemRect(i);
    return x>=r.x-4&&x<=r.x+r.w+4&&y>=r.y-4&&y<=r.y+r.h+4;
  });
  if(t){ setTool('select'); openEditor(t); }
});

/* ---------- 画像 ---------- */
$('imgInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const max=1000;
      let w=im.width,h=im.height;
      const sc=Math.min(1,max/Math.max(w,h));
      const cnv=document.createElement('canvas');
      cnv.width=Math.round(w*sc); cnv.height=Math.round(h*sc);
      cnv.getContext('2d').drawImage(im,0,0,cnv.width,cnv.height);
      const src=cnv.toDataURL('image/jpeg',.86);
      const dw=Math.min(320,cnv.width), dh=dw*cnv.height/cnv.width;
      pushUndo();
      const it={id:uid(),t:'img',x:PAGE_W/2-dw/2,y:PAGE_H/2-dh/2,w:dw,h:dh,src,rot:0};
      S.items.push(it); IMGC[src]=im;
      setTool('select'); S.sel=[it]; S.selBox=boxOf([it]);
      render(); renderOverlay(); scheduleSave();
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(f);
  e.target.value='';
});
</script>
<script>
/* =========================================================
   UI / ズーム / 保存メニュー / Google Drive / PWA
   ========================================================= */
function toast(msg,ms){
  const t=$('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),ms||2000);
}

/* ---------- ツール切替 ---------- */
const TOOL_BTN={select:'tSelect',pen:'tPen',marker:'tMarker',eraser:'tEraser',text:'tText',image:'tImage'};
function setTool(t){
  if(t==='image'){ $('imgInput').click(); return; }
  S.tool=t;
  for(const k in TOOL_BTN) $(TOOL_BTN[k]).classList.toggle('on',k===t);
  document.querySelectorAll('#opts .grp').forEach(g=>{
    const f=(g.dataset.for||'').split(' ');
    g.style.display=f.includes(t)?'':'none';
  });
  cv.style.cursor = t==='select'?'default' : t==='text'?'text' : 'crosshair';
  if(t!=='select') clearSel();
}
for(const k in TOOL_BTN) $(TOOL_BTN[k]).onclick=()=>setTool(k);

/* ---------- 色・太さ ---------- */
function buildSwatches(host,colors,get,set){
  const h=$(host);
  colors.forEach(c=>{
    const s=document.createElement('span');
    s.className='sw'+(get()===c?' on':''); s.style.background=c; s.dataset.c=c;
    s.onclick=()=>{ set(c); h.querySelectorAll('.sw').forEach(e=>e.classList.toggle('on',e.dataset.c===c)); };
    h.appendChild(s);
  });
}
buildSwatches('penColors',PEN_COLORS,()=>S.pen.color,c=>S.pen.color=c);
buildSwatches('mkColors',MK_COLORS,()=>S.marker.color,c=>S.marker.color=c);
buildSwatches('txColors',PEN_COLORS,()=>S.text.color,c=>{S.text.color=c; applyTextStyle();});
document.querySelectorAll('.wbtn').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.wbtn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const w=+b.dataset.w; S.pen.w=w; S.marker.w=w;
  };
});
$('eraSize').oninput=e=>{ S.eraser.size=+e.target.value; $('eraNum').textContent=e.target.value; };
$('lasFree').onclick=()=>{ S.lasso='free'; $('lasFree').classList.add('on'); $('lasRect').classList.remove('on'); };
$('lasRect').onclick=()=>{ S.lasso='rect'; $('lasRect').classList.add('on'); $('lasFree').classList.remove('on'); };
$('bClearPage').onclick=()=>{
  if(!confirm('このページの書き込みをすべて消去します。よろしいですか？')) return;
  pushUndo(); S.items=[]; clearSel(); render(); scheduleSave();
};
$('penOnly').onchange=e=>{ S.penOnly=e.target.checked; };

/* テキスト設定 */
function applyTextStyle(){
  const t=S.sel.filter(i=>i.t==='text');
  if(t.length){ pushUndo(); t.forEach(i=>{ i.font=S.text.font; i.size=S.text.size; i.c=S.text.color; });
    S.selBox=boxOf(S.sel); render(); renderOverlay(); scheduleSave(); }
}
$('fontSel').onchange=e=>{ S.text.font=e.target.value; applyTextStyle(); };
function setFS(v){
  S.text.size=Math.max(9,Math.min(48,v));
  $('fsRange').value=S.text.size; $('fsNum').textContent=S.text.size+'px';
  if(ta){ ta.style.fontSize=S.text.size+'px'; const it=S.items.find(i=>i.id===editingId); if(it) it.size=S.text.size; }
  applyTextStyle();
}
$('fsRange').oninput=e=>setFS(+e.target.value);
$('fsPlus').onclick=()=>setFS(S.text.size+1);
$('fsMinus').onclick=()=>setFS(S.text.size-1);

/* ---------- Undo/Redo ---------- */
$('bUndo').onclick=undo; $('bRedo').onclick=redo;
window.addEventListener('keydown',e=>{
  if(ta) return;
  const cmd=e.ctrlKey||e.metaKey;
  if(cmd&&e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); }
  else if(cmd&&e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); }
  else if((e.key==='Delete'||e.key==='Backspace')&&S.sel.length){
    e.preventDefault(); pushUndo(); S.items=S.items.filter(i=>!S.sel.includes(i)); clearSel(); render(); scheduleSave();
  }
  else if(e.key==='Escape') clearSel();
  else if(!cmd&&e.key==='['){ shiftMonth(-1); }
  else if(!cmd&&e.key===']'){ shiftMonth(1); }
});

/* ---------- ズーム ---------- */
const stage=$('stage'), scroller=$('scroller');
function applyZoom(){
  page.style.transform=`scale(${S.zoom})`;
  stage.style.width=(PAGE_W*S.zoom+44)+'px';
  stage.style.height=(PAGE_H*S.zoom+44)+'px';
  fitCanvas();
}
function setZoom(z){ S.zoom=Math.max(.3,Math.min(3,z)); applyZoom(); }
/* ピンチ用：指の中心を固定したまま拡縮する（キャンバス再生成は指を離してから） */
function zoomAt(z,cx,cy){
  z=Math.max(.3,Math.min(3,z));
  const pr=page.getBoundingClientRect();
  const px=(cx-pr.left)/S.zoom, py=(cy-pr.top)/S.zoom;
  S.zoom=z;
  page.style.transform=`scale(${z})`;
  stage.style.width=(PAGE_W*z+44)+'px';
  stage.style.height=(PAGE_H*z+44)+'px';
  const pr2=page.getBoundingClientRect();
  scroller.scrollLeft+=(pr2.left+px*z)-cx;
  scroller.scrollTop +=(pr2.top +py*z)-cy;
}
function fitPage(){
  const w=scroller.clientWidth-52, h=scroller.clientHeight-52;
  S.fit=Math.min(w/PAGE_W,h/PAGE_H);
  setZoom(S.fit);
}
$('bZoomIn').onclick=()=>setZoom(S.zoom*1.2);
$('bZoomOut').onclick=()=>setZoom(S.zoom/1.2);
$('bFit').onclick=fitPage;
scroller.addEventListener('wheel',e=>{
  if(!(e.ctrlKey||e.metaKey)) return;
  e.preventDefault(); setZoom(S.zoom*(e.deltaY<0?1.1:1/1.1));
},{passive:false});

function syncChromeH(){
  document.documentElement.style.setProperty('--chromeH',$('chrome').offsetHeight+'px');
}
window.addEventListener('resize',()=>{ syncChromeH(); fitPage(); });

/* ---------- メニュー / バックアップ ---------- */
function modal(html,setup){
  const m=el('mask'); const box=el('modal',null,html); m.appendChild(box);
  m.addEventListener('pointerdown',e=>{ if(e.target===m) m.remove(); });
  document.body.appendChild(m);
  setup&&setup(box,()=>m.remove());
  return m;
}
$('bMenu').onclick=()=>{
  const cid=localStorage.getItem('gdrive_client_id')||'';
  modal(`
    <h2>保存とバックアップ</h2>
    <p>書き込みは端末内（IndexedDB）へ自動保存されています。以下は端末をまたぐバックアップ用です。</p>
    <div class="mrow">
      <button class="btn" id="mExp">JSONを書き出す</button>
      <button class="btn" id="mImp">JSONを読み込む</button>
    </div>
    <h2 style="margin-top:22px">Google Drive 同期（BYOD）</h2>
    <p>ご自身のGoogle Driveに <b>planner-backup.json</b> として保存します。サーバー不要・データはご自身の管理下に置かれます。</p>
    <p style="margin-top:10px"><b>OAuth クライアントID</b></p>
    <input type="text" id="mCid" placeholder="xxxxxxxx.apps.googleusercontent.com" value="${cid}">
    <details style="margin-top:10px"><summary style="font-size:12.5px;color:#3d7ebd;cursor:pointer">クライアントIDの取り方</summary>
      <ol>
        <li>Google Cloud Console で新規プロジェクトを作成</li>
        <li>「APIとサービス」→ Google Drive API を有効化</li>
        <li>「OAuth同意画面」を外部・テストユーザーに自分を追加</li>
        <li>「認証情報」→ OAuthクライアントID →「ウェブアプリケーション」</li>
        <li>承認済みJavaScript生成元に、このアプリを置くURL（例: https://yourname.github.io）を登録</li>
        <li>発行されたクライアントIDを上の欄に貼り付け</li>
      </ol>
    </details>
    <div class="mrow">
      <button class="btn pri" id="mBk">Driveへバックアップ</button>
      <button class="btn" id="mRs">Driveから復元</button>
    </div>
    <h2 style="margin-top:22px">iPad / PC でアプリとして使う</h2>
    <p>Safari または Chrome でこのページを開き、共有メニューから「ホーム画面に追加」。アドレスバーのないフルスクリーンのアプリとして起動します。</p>
  `,(box,close)=>{
    box.querySelector('#mExp').onclick=async()=>{ await exportJSON(); };
    box.querySelector('#mImp').onclick=()=>{ $('jsonInput').click(); close(); };
    box.querySelector('#mCid').onchange=e=>localStorage.setItem('gdrive_client_id',e.target.value.trim());
    box.querySelector('#mBk').onclick=async()=>{
      localStorage.setItem('gdrive_client_id',box.querySelector('#mCid').value.trim());
      close(); await driveBackup();
    };
    box.querySelector('#mRs').onclick=async()=>{
      localStorage.setItem('gdrive_client_id',box.querySelector('#mCid').value.trim());
      close(); await driveRestore();
    };
  });
};
async function exportJSON(){
  await flushSave();
  const data={app:'handwriting-planner',v:1,at:new Date().toISOString(),pages:await Store.all()};
  const b=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=`planner-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  toast('JSONを書き出しました');
}
$('jsonInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=async()=>{
    try{
      const d=JSON.parse(fr.result);
      if(!d.pages) throw 0;
      await Store.putAll(d.pages);
      await loadPage(); toast('読み込みました');
    }catch(err){ toast('ファイルを読めませんでした'); }
  };
  fr.readAsText(f); e.target.value='';
});

/* ---------- Google Drive ---------- */
const DRIVE_FILE='planner-backup.json';
let gisReady=null, accessToken=null, tokenExp=0;
function loadGIS(){
  if(gisReady) return gisReady;
  gisReady=new Promise((res,rej)=>{
    if(window.google&&google.accounts) return res();
    const s=document.createElement('script');
    s.src='https://accounts.google.com/gsi/client'; s.async=true;
    s.onload=()=>res(); s.onerror=()=>rej(new Error('gis'));
    document.head.appendChild(s);
  });
  return gisReady;
}
async function getToken(){
  const cid=localStorage.getItem('gdrive_client_id');
  if(!cid){ toast('先にクライアントIDを設定してください'); throw new Error('no client id'); }
  if(accessToken&&Date.now()<tokenExp-60000) return accessToken;
  await loadGIS();
  return new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({
      client_id:cid,
      scope:'https://www.googleapis.com/auth/drive.file',
      callback:r=>{
        if(r.error) return rej(new Error(r.error));
        accessToken=r.access_token; tokenExp=Date.now()+(r.expires_in||3500)*1000; res(accessToken);
      }
    });
    tc.requestAccessToken({prompt:''});
  });
}
async function driveFind(tok){
  const q=encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`);
  const r=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,modifiedTime)`,
    {headers:{Authorization:'Bearer '+tok}});
  const j=await r.json();
  return (j.files&&j.files[0])||null;
}
async function driveBackup(){
  try{
    chip('Drive同期中…');
    await flushSave();
    const tok=await getToken();
    const body=JSON.stringify({app:'handwriting-planner',v:1,at:new Date().toISOString(),pages:await Store.all()});
    const f=await driveFind(tok);
    if(f){
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${f.id}?uploadType=media`,
        {method:'PATCH',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body});
    }else{
      const boundary='-------planner'+Date.now();
      const meta=JSON.stringify({name:DRIVE_FILE,mimeType:'application/json'});
      const multipart=
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n`+
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
      await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',
        {method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'multipart/related; boundary='+boundary},body:multipart});
    }
    chip('保存済み'); toast('Google Driveへバックアップしました');
  }catch(e){ chip('保存済み'); toast('Drive同期に失敗しました（設定と通信環境をご確認ください）',3200); }
}
async function driveRestore(){
  try{
    chip('Drive読込中…');
    const tok=await getToken();
    const f=await driveFind(tok);
    if(!f){ chip('保存済み'); return toast('Drive上にバックアップが見つかりません'); }
    const r=await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`,{headers:{Authorization:'Bearer '+tok}});
    const d=await r.json();
    if(!d.pages) throw 0;
    await Store.putAll(d.pages);
    await loadPage(); chip('保存済み'); toast('Driveから復元しました');
  }catch(e){ chip('保存済み'); toast('復元に失敗しました',3200); }
}

/* ---------- PWA ---------- */
(function pwa(){
  const icon='data:image/svg+xml;base64,'+btoa(
    `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="512" height="512" rx="96" fill="#24425f"/><rect x="96" y="128" width="320" height="272" rx="16" fill="#fff"/><rect x="96" y="128" width="320" height="52" fill="#e8a9b8"/><g stroke="#c6ced6" stroke-width="6"><path d="M96 244h320M96 316h320M186 180v220M276 180v220M366 180v220"/></g></svg>`);
  const link=document.createElement('link'); link.rel='apple-touch-icon'; link.href=icon; document.head.appendChild(link);
  const man={name:'Handwriting Planner',short_name:'Planner',display:'standalone',orientation:'landscape',
    background_color:'#e7e9ec',theme_color:'#24425f',start_url:'.',icons:[{src:icon,sizes:'512x512',type:'image/svg+xml'}]};
  const ml=document.createElement('link'); ml.rel='manifest';
  ml.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));
  document.head.appendChild(ml);
})();

/* ---------- ジェスチャー抑制 ---------- */
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>{ if(e.target===cv) e.preventDefault(); });
window.addEventListener('beforeunload',()=>{ try{ flushSave(); }catch(e){} });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) flushSave(); });

/* ---------- 起動 ---------- */
(async function init(){
  if(navigator.maxTouchPoints>1){            // iPad等：既定でパームリジェクションON
    S.penOnly=true; $('penOnly').checked=true;
  }
  setTool('pen'); setFS(16);
  syncChromeH();
  await Store.init();
  await loadPage();
  fitPage();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>render());
  chip('保存済み');
})();
</script>
